[project]
name = "evagpt"
description = "Arch Linux dotfiles"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Gary Wei", email = "garywei944@gmail.com" }]
readme = "README.md"
classifiers = [
    #    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

# The best practice:
# For libraries, use >= together with < to avoid breaking changes in dependencies.
#     ~=a.b is equivalent to >=a.b, ==a.*
#     ~=a.b.c is equivalent to >=a.b.c, ==a.b.* (PEP 440 compatible)
# For applications, use exact versions to ensure reproducibility.
# If a dependency is an open-source library which releases frequent updates, only
#     specify the major version to get the latest features and bug fixes, e.g. requests~=2.25.

# Please maintain this list in alphabetical order, per group.
dependencies = []

# ---------------- Black ----------------
[tool.black]
line-length = 120
target-version = ["py314"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["F722"]

[tool.ruff.lint.isort]
known-first-party = ["eden", "evakit"]

[tool.ruff.format]
quote-style = "double"

# [tool.ruff.lint.per-file-ignores]
# "eden/__main__.py" = ["E402"]

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.14"
strict = false

warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

disallow_untyped_defs = false
disallow_incomplete_defs = false

check_untyped_defs = true
implicit_optional = false

pretty = true
show_error_codes = true

# Allow gradual typing (important for personal projects)
ignore_missing_imports = true

[tool.pylint.typecheck]
confidence = [
    "HIGH",
    "CONTROL_FLOW",
    "INFERENCE",
    "INFERENCE_FAILURE",
    "UNDEFINED",
]
generated-members = ["sh"]

# ---------------- Commitizen ----------------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = false
version = "0.1.0"
version_files = ["__version__.py:__version__"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "13.0" }]

[tool.pixi.pypi-dependencies]
evagpt = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
cuda-version = "13.0.*"
pytorch-gpu = { version = ">=2.13.0,<3", build = "cuda130*" }
