[project]
name = "evagpt"
description = "evagpt project, educational reimplementation of nonaGPT"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Gary Wei", email = "garywei944@gmail.com" }]
readme = "README.md"
classifiers = [
    #    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

# The best practice:
# For libraries, use >= together with < to avoid breaking changes in dependencies.
#     ~=a.b is equivalent to >=a.b, ==a.*
#     ~=a.b.c is equivalent to >=a.b.c, ==a.b.* (PEP 440 compatible)
# For applications, use exact versions to ensure reproducibility.
# If a dependency is an open-source library which releases frequent updates, only
#     specify the major version to get the latest features and bug fixes, e.g. requests~=2.25.

# Please maintain this list in alphabetical order, per group.
dependencies = []

# ---------------- Black ----------------
[tool.black]
line-length = 120
target-version = ["py314"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["F722"]

[tool.ruff.lint.isort]
known-first-party = ["eden", "evakit"]

[tool.ruff.format]
quote-style = "double"

# [tool.ruff.lint.per-file-ignores]
# "eden/__main__.py" = ["E402"]

# ---------------- Pyrefly ----------------
[tool.pyrefly]
project-includes = ["src", "scripts", "tests"]
python-version = "3.14"
# Pin to the pixi env; otherwise Pyrefly walks up and picks ~/.venv.
python-interpreter-path = ".pixi/envs/default/bin/python"

# ---------------- Commitizen ----------------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = false
version = "0.1.0"
version_files = ["__version__.py:__version__"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "13.0" }]

[tool.pixi.pypi-dependencies]
evagpt = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
attrs = ">=26.1.0,<27"
cuda-version = "13.0.*"
datasets = ">=5.0.1,<6"
jaxtyping = ">=0.3.11,<0.4"
jupyter = ">=1.1.1,<2"
numpy = ">=2.5.2,<3"
pandarallel = ">=1.6.5,<2"
pandas = ">=3.0.5,<4"
python-dotenv = ">=1.2.3,<2"
pytorch-gpu = { version = ">=2.13.0,<3", build = "cuda130*" }
tiktoken = ">=0.14.0,<0.15"
transformers = ">=5.15.1,<6"
huggingface_hub = ">=1.28.0,<2"
typed-argument-parser = ">=1.12.0,<2"
tqdm = ">=4.70.0,<5"
pyrefly = ">=1.2.0,<2"
types-tqdm = ">=4.70.0.20260827,<5"
lightning = ">=2.6.5,<3"
debugpy = ">=1.8.21,<2"
tensorboard = ">=2.20.0,<3"
